<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뮈토스의 아이들</title>
<link rel="stylesheet" href="style.css?v=17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <div class="logo" onclick="goHome()">MYTHOS</div>

  <div class="topbar-right">
    <div id="system-status" class="system-status">동기화 중...</div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</header>

<main class="layout">

  <section class="panel">
    <div class="panel-title">PLAY MENU</div>
    <button class="menu-btn">조사하러 가기</button>
    <button class="menu-btn">조사일지</button>
    <button class="menu-btn">개인 메모</button>
    <button class="menu-btn">인벤토리</button>
  </section>

  <section class="character-section">
    <div class="character-card-wrap" onclick="flipCharacterCard()">

      <div class="character-card">

        <!-- 카드 앞면 -->
        <div class="character-card-face character-card-front">

          <div class="portrait-frame">
            <img src="" class="portrait" id="character-portrait" alt="캐릭터 인장">

            <div class="portrait-empty" id="portrait-empty">
              <div>500 × 500</div>
            </div>
          </div>

          <button class="portrait-btn" onclick="event.stopPropagation(); updatePortrait();">
            인장 등록
          </button>

          <input
            type="file"
            id="portrait-upload-input"
            accept="image/*"
            style="display: none;"
          >

          <h2 id="character-name">캐릭터명</h2>

          <div class="sub-info" id="character-origin">
            클레이오니아 · 출신지
          </div>

          <div class="info-list">
            <div id="character-age">나이</div>
            <div id="character-location">현재 위치 : -</div>
            <div id="character-money">보유 재화 : 0골드</div>
          </div>

        </div>

        <!-- 카드 뒷면 -->
        <div class="character-card-face character-card-back">

          <div class="stat-title">능력치</div>

          <div class="stat-list">
            <div class="stat-row">
              <span>근력</span>
              <strong id="stat-strength">-</strong>
            </div>

            <div class="stat-row">
              <span>체력</span>
              <strong id="stat-stamina">-</strong>
            </div>

            <div class="stat-row">
              <span>민첩</span>
              <strong id="stat-agility">-</strong>
            </div>

            <div class="stat-row">
              <span>정신</span>
              <strong id="stat-mental">-</strong>
            </div>

            <div class="stat-row">
              <span>지력</span>
              <strong id="stat-intelligence">-</strong>
            </div>

            <div class="stat-row">
              <span>행운</span>
              <strong id="stat-luck">-</strong>
            </div>
          </div>

        </div>

      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">NOTICE</div>

    <div class="card">
      <div class="small-title">안내</div>
      <p>조사는 지정된 시간에만 진행됩니다.</p>
    </div>

    <div class="card notice-card">
      <div class="small-title">현재 상태</div>
      <p>로그인 후 캐릭터 정보를 확인할 수 있습니다.</p>
    </div>
  </section>

</main>

<!-- 로그인 모달 -->
<div id="login-modal" class="modal">
  <div class="modal-box">
    <h2>MYTHOS</h2>

    <input type="text" placeholder="개인코드" id="login-code">

    <button class="modal-btn" onclick="loginPlayer()">로그인</button>
    <button class="modal-btn" onclick="openRegisterModal()">회원가입</button>
  </div>
</div>

<!-- 회원가입 모달 -->
<div id="register-modal" class="modal" style="display: none;">
  <div class="modal-box">
    <h2>회원가입</h2>

    <input type="text" placeholder="캐릭터명" id="characterName">

    <select id="age" class="modal-input">
      <option value="">나이를 선택하세요</option>
      <option value="14">14세</option>
      <option value="15">15세</option>
      <option value="16">16세</option>
      <option value="17">17세</option>
      <option value="18">18세</option>
      <option value="19">19세</option>
    </select>

    <select id="origin" class="modal-input">
      <option value="">출신지를 선택하세요</option>
      <option value="수도 탈리스">수도 탈리스</option>
      <option value="동부 모네타">동부 모네타</option>
      <option value="서부 아르스">서부 아르스</option>
      <option value="남부 세렌티아">남부 세렌티아</option>
      <option value="북부 니발리스">북부 니발리스</option>
    </select>

<div class="stat-input-title">ABILITY STATUS</div>

<div class="stat-input-grid">
  <label>근력
    <select id="strength" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>

  <label>체력
    <select id="stamina" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>

  <label>민첩
    <select id="agility" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>

  <label>정신
    <select id="mental" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>

  <label>지력
    <select id="intelligence" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>

  <label>행운
    <select id="luck" class="modal-input">
      <option value="">-</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>
</div>

    <button class="modal-btn" onclick="registerPlayer()">가입하기</button>
    <button class="modal-btn" onclick="backToLoginModal()">돌아가기</button>
  </div>
</div>

<!-- 가입 완료 모달 -->
<div id="register-complete-modal" class="modal" style="display: none;">
  <div class="modal-box complete-box">
    <h2>가입이 완료되었습니다</h2>

    <p class="complete-text">
      아래 개인코드를 반드시 저장해주세요.
    </p>

    <div class="code-box" id="issued-code">
      P-000000
    </div>

    <button class="modal-btn" onclick="copyIssuedCode()">
      개인코드 복사하기
    </button>

    <button class="modal-btn secondary" onclick="closeCompleteModal()">
      로그인으로 이동
    </button>
  </div>
</div>

<script src="script.js?v=17"></script>

</body>
</html>
