<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>뮈토스의 아이들</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">

  <div class="logo">
    MYTHOS
  </div>

  <nav>
    <button class="nav-btn">조사</button>
    <button class="nav-btn">인벤토리</button>
    <button class="nav-btn">메모</button>
  </nav>

</header>


<main class="layout">

  <!-- 왼쪽 -->

  <section class="panel">

    <div class="panel-title">
      조사 기록
    </div>

    <div class="card">

      <div class="small-title">
        최근 조사
      </div>

      <p>
        아직 기록이 없습니다.
      </p>

    </div>

  </section>


  <!-- 가운데 -->

  <section class="character-section">

    <div class="character-card">

      <img
        src="https://placehold.co/320x420"
        class="portrait"
      >

      <h2>토우코</h2>

      <div class="sub-info">
        클레이오니아 · 남부 세렌티아
      </div>

      <div class="info-list">

        <div>28세</div>

        <div>현재 위치 : 도서관</div>

        <div>보유 재화 : 0골드</div>

      </div>

    </div>

  </section>


  <!-- 오른쪽 -->

  <section class="panel">

    <div class="panel-title">
      개인 메모
    </div>

    <div class="card">

      <div class="small-title">
        최근 메모
      </div>

      <p>
        아직 메모가 없습니다.
      </p>

    </div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
